<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Totem — Colégio Tadeu Thiago</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;
  --surface:#F6F7FA;
  --surface-2:#FFFFFF;
  --card-bg:#FFFFFF;
  --corridor-fill:#EEF0F4;
  --border:#E7E9EF;
  --text:#14171F;
  --muted:#71778C;
  --accent:#2F5DFB;
  --accent-soft:rgba(47,93,251,0.09);
  --accessible:#17A673;
  --alert:#E2472B;
  --alert-text:#8a2f1c;
  --ink:#14171F;
  --on-ink:#FFFFFF;
  --legend-bg:rgba(255,255,255,.92);
  --g-ensino:#2F5DFB;
  --g-servicos:#8B5CF6;
  --g-alimentacao:#F2994A;
  --g-convivencia:#17A673;
  --g-necessidades:#71778C;
  --g-outros:#B7BCC9;
  --shadow: 0 8px 28px rgba(20,23,31,0.07);
  --shadow-sm: 0 2px 8px rgba(20,23,31,0.05);
}

/* ---------- DARK THEME (estilo Google Maps "modo noturno") ---------- */
html[data-theme="dark"]{
  --bg:#1A1D23;
  --surface:#20242C;
  --surface-2:#262B34;
  --card-bg:#262B34;
  --corridor-fill:#1E222A;
  --border:#363C48;
  --text:#E7E9EF;
  --muted:#8B93A7;
  --accent:#7FA0FF;
  --accent-soft:rgba(127,160,255,0.16);
  --accessible:#33D6A6;
  --alert:#FF7A63;
  --alert-text:#FFC9BC;
  --ink:#EDEFF4;
  --on-ink:#14171F;
  --legend-bg:rgba(38,43,52,.92);
  --g-ensino:#7FA0FF;
  --g-servicos:#B79CFF;
  --g-alimentacao:#FFB067;
  --g-convivencia:#33D6A6;
  --g-necessidades:#9AA1B4;
  --g-outros:#5B616F;
  --shadow: 0 8px 28px rgba(0,0,0,0.45);
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.35);
}

*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;
  height:100vh; height:100dvh; overflow:hidden; display:flex; flex-direction:column;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit; cursor:pointer;}
::selection{ background:var(--accent); color:#fff; }

/* transição suave entre temas, igual à do Google Maps */
body, header, .floors, .sidebar, .map-frame, .panel, .search, .chip, .place-card,
.floor-btn, .p-stat, .btn-secondary, .idle-card, .nav-btn, .legend, .a11y-toggle,
.theme-toggle, svg#floorplan, .room rect, .corridor, .you-label-bg{
  transition: background-color .25s ease, border-color .25s ease, color .25s ease, fill .25s ease, stroke .25s ease;
}

/* ---------- HEADER ---------- */
header{
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 28px; border-bottom:1px solid var(--border); flex-shrink:0;
}
.brand{ display:flex; align-items:center; gap:14px; }
.brand .mark{
  width:42px; height:42px; border-radius:12px;
  background: var(--accent);
  display:flex; align-items:center; justify-content:center;
  font-family:'Space Grotesk'; font-weight:700; color:#fff; font-size:13.5px; letter-spacing:-.02em;
}
.brand h1{ font-family:'Space Grotesk'; font-size:20px; font-weight:600; }
.brand span{ display:block; font-size:12px; color:var(--muted); margin-top:1px; }
.head-right{ display:flex; align-items:center; gap:18px; }
#clock{ font-family:'IBM Plex Mono'; font-size:14px; color:var(--muted); }

.a11y-toggle{
  display:flex; align-items:center; gap:10px;
  padding:8px 14px; border-radius:100px; border:1px solid var(--border);
  background:var(--surface); font-size:13px; font-weight:600; color:var(--text);
}
.switch{ width:38px; height:22px; border-radius:100px; background:#D8DBE3; position:relative; transition:background .15s ease; }
.switch::after{ content:''; position:absolute; width:16px; height:16px; border-radius:50%; background:#fff; top:3px; left:3px; transition:left .15s ease; box-shadow:0 1px 3px rgba(0,0,0,.2); }
.a11y-toggle.on .switch{ background:var(--accessible); }
.a11y-toggle.on .switch::after{ left:19px; }

.theme-toggle{
  width:38px; height:38px; border-radius:100px; border:1px solid var(--border);
  background:var(--surface); color:var(--text); display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
.theme-toggle:hover{ border-color:var(--muted); }
.theme-toggle svg{ width:18px; height:18px; }
.theme-toggle .icon-moon{ display:none; }
html[data-theme="dark"] .theme-toggle .icon-sun{ display:none; }
html[data-theme="dark"] .theme-toggle .icon-moon{ display:block; }

/* ---------- FLOOR TABS ---------- */
.floors{ display:flex; gap:8px; padding:14px 28px; border-bottom:1px solid var(--border); flex-shrink:0; align-items:center; }
.floor-btn{
  font-family:'Space Grotesk'; font-weight:600; font-size:14px;
  background:var(--surface); color:var(--muted); border:1px solid var(--border);
  padding:10px 20px; border-radius:100px; transition:all .15s ease;
}
.floor-btn:hover{ color:var(--text); }
.floor-btn.active{ background:var(--ink); color:var(--on-ink); border-color:var(--ink); }
.floor-btn.needed{ box-shadow:0 0 0 3px var(--accent-soft); border-color:var(--accent); color:var(--accent); }
.floor-hint{ font-size:12.5px; color:var(--accent); font-weight:600; margin-left:6px; }

/* ---------- MAIN ---------- */
main{ flex:1; display:flex; min-height:0; }

.sidebar{
  width:480px; flex-shrink:0; display:flex; flex-direction:column; min-height:0;
  border-right:1px solid var(--border); padding:20px 20px 0 20px;
}
h2.eyebrow{ font-family:'Space Grotesk'; font-size:22px; font-weight:600; margin-bottom:14px; }

.search{
  display:flex; align-items:center; gap:10px;
  background:var(--surface); border:1px solid var(--border); border-radius:16px;
  padding:15px 16px; flex-shrink:0;
}
.search input{ background:transparent; border:none; outline:none; font-size:15px; width:100%; color:var(--text); }
.search input::placeholder{ color:var(--muted); }
.search svg{ flex-shrink:0; color:var(--muted); }

.groups{ overflow-y:auto; flex:1; margin-top:16px; padding-bottom:14px; margin-right:-10px; padding-right:10px; }
.groups::-webkit-scrollbar{ width:6px; }
.groups::-webkit-scrollbar-thumb{ background:var(--border); border-radius:10px; }

.chip-row{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:4px; }
.chip{
  font-size:13px; font-weight:500; padding:9px 14px; border-radius:100px; border:1px solid var(--border);
  color:var(--muted); display:flex; align-items:center; gap:7px; transition:all .15s ease; background:var(--card-bg);
}
.chip .dot{ width:8px; height:8px; border-radius:50%; }
.chip.active{ color:#fff; border-color:transparent; }
.chip.active.ink{ color:var(--on-ink); }

.list-title{ font-family:'Space Grotesk'; font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); margin:18px 0 10px 2px; }

/* place-card grid — inspired by the totem preview's card list */
.place-grid{ display:grid; grid-template-columns:1fr 1fr; gap:11px; }
.place-card{
  text-align:left; background:var(--card-bg); border:1px solid var(--border); border-radius:17px;
  padding:15px; cursor:pointer; transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  color:var(--text);
}
.place-card:hover{ transform:translateY(-2px); box-shadow:var(--shadow-sm); }
.place-card.selected{ border-color:var(--accent); background:var(--accent-soft); }
.p-top{ display:flex; align-items:flex-start; justify-content:space-between; }
.p-badge-sm{ width:32px; height:32px; border-radius:9px; flex-shrink:0; display:flex; align-items:center; justify-content:center; color:#fff; }
.p-badge-sm svg{ width:16px; height:16px; }
.p-arrow{ color:var(--muted); font-size:14px; line-height:1; margin-top:4px; }
.place-card strong{ display:block; margin-top:12px; font-family:'Space Grotesk'; font-size:13.5px; font-weight:600; line-height:1.3; }
.place-card .p-card-meta{ display:block; font-size:11px; color:var(--muted); margin-top:3px; }
.empty{ color:var(--muted); font-size:13px; padding:16px 4px; grid-column:1/-1; }

/* ---------- MAP ---------- */
.map-wrap{ flex:1; position:relative; padding:20px; display:flex; align-items:center; justify-content:center; min-width:0; }
.map-frame{ width:100%; height:100%; background:var(--surface); border:1px solid var(--border); border-radius:20px; position:relative; overflow:hidden; }
svg#floorplan{ width:100%; height:100%; display:block; }

.room{ cursor:pointer; }
.room rect{ stroke-width:1.6; transition:filter .15s ease, stroke-width .15s ease; }
.room:hover rect{ filter:brightness(0.97); }
.room.dim{ opacity:.24; }
.room.selected rect{ stroke-width:3; }
.room .badge-num{ font-family:'IBM Plex Mono'; font-weight:600; font-size:12px; }
.room-label{ font-family:'Inter'; font-weight:500; font-size:10.5px; fill:var(--text); pointer-events:none; }
.room-sub{ font-family:'Inter'; font-size:8.5px; fill:var(--muted); pointer-events:none; }

.corridor{ fill:var(--corridor-fill); stroke:var(--border); stroke-width:1; }
.corridor-label{ font-family:'Space Grotesk'; font-size:10.5px; fill:var(--muted); letter-spacing:.14em; }

.pin-pulse{ transform-origin:center; animation:pulse 2.2s ease-out infinite; }
.pin-pulse2{ transform-origin:center; animation:pulse 2.2s ease-out infinite; animation-delay:.7s; }
@keyframes pulse{ 0%{ r:6; opacity:.5; } 100%{ r:36; opacity:0; } }
.you-label{ font-family:'Space Grotesk'; font-weight:700; font-size:11.5px; fill:var(--accent); letter-spacing:.03em; }
.you-label-bg{ fill:var(--card-bg); }

.route-line{ fill:none; stroke:var(--accent); stroke-width:4; stroke-linecap:round; stroke-dasharray:9 9; animation:dash 1s linear infinite; }
.route-line.accessible{ stroke:var(--accessible); }
/* variante usada durante a reprodução em vídeo: traço sólido que se desenha
   progressivamente (sem "marcha" infinita), no ritmo real da caminhada */
.route-line-video{ fill:none; stroke:var(--accent); stroke-width:4.5; stroke-linecap:round; stroke-linejoin:round; }
.route-line-video.accessible{ stroke:var(--accessible); }
@keyframes dash{ to{ stroke-dashoffset:-36; } }
.route-endpoint{ fill:var(--accent); }
.route-endpoint.accessible{ fill:var(--accessible); }

.video-toast{
  position:absolute; top:18px; left:50%; transform:translateX(-50%) translateY(-6px);
  background:var(--ink); color:var(--on-ink); font-family:'Space Grotesk'; font-weight:600; font-size:13px;
  padding:10px 20px; border-radius:100px; box-shadow:var(--shadow-sm);
  opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease; z-index:6; white-space:nowrap;
}
.video-toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

.legend{ position:absolute; left:36px; bottom:26px; display:flex; gap:14px; background:var(--legend-bg); backdrop-filter:blur(4px); padding:10px 14px; border-radius:12px; border:1px solid var(--border); box-shadow:var(--shadow-sm); }
.legend div{ display:flex; align-items:center; gap:6px; font-size:11px; color:var(--muted); font-weight:500; }
.legend span{ width:9px; height:9px; border-radius:50%; display:inline-block; }

/* ---------- RIGHT PANEL ---------- */
.panel{ width:360px; flex-shrink:0; border-left:1px solid var(--border); display:flex; flex-direction:column; min-height:0; }
.panel-empty{ flex:1; display:flex; align-items:center; justify-content:center; padding:30px; text-align:center; color:var(--muted); font-size:14px; line-height:1.6; }
.panel-empty svg{ display:block; margin:0 auto 14px auto; opacity:.4; }

.panel-content{ padding:26px 24px; flex:1; overflow-y:auto; }
.p-badge{ width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; color:#fff; margin-bottom:16px; }
.p-badge svg{ width:26px; height:26px; }
.p-name{ font-family:'Space Grotesk'; font-size:24px; font-weight:600; line-height:1.2; }
.p-meta{ font-size:13.5px; color:var(--muted); margin-top:6px; font-weight:500; }
.p-desc{ font-size:13.5px; color:var(--text); line-height:1.6; margin-top:16px; }

.p-stats{ display:flex; gap:10px; margin-top:20px; }
.p-stat{ flex:1; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px; }
.p-stat b{ display:block; font-family:'Space Grotesk'; font-size:19px; }
.p-stat span{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }

.btn{ width:100%; padding:16px; border-radius:14px; border:none; font-family:'Space Grotesk'; font-weight:600; font-size:15px; text-align:center; margin-top:12px; transition:transform .08s ease, opacity .15s ease; }
.btn:active{ transform:scale(0.98); }
.btn-primary{ background:var(--accent); color:#fff; }
.btn-primary.accessible{ background:var(--accessible); }
.btn-secondary{ background:var(--surface); color:var(--text); border:1px solid var(--border); }

.alert-box{ margin-top:16px; display:flex; gap:10px; padding:12px 14px; border-radius:12px; background:rgba(226,71,43,0.08); border:1px solid rgba(226,71,43,0.25); }
.alert-box svg{ flex-shrink:0; color:var(--alert); margin-top:1px; }
.alert-box span{ font-size:12px; color:var(--alert-text); line-height:1.5; }

/* ---------- ROUTE STEPS PANEL ---------- */
.route-head{ padding:22px 24px 16px 24px; border-bottom:1px solid var(--border); }
.route-head .r-from-to{ font-size:12px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.06em; }
.route-head h2{ font-family:'Space Grotesk'; font-size:21px; font-weight:600; margin-top:6px; }
.route-stats{ display:flex; gap:10px; margin-top:14px; }

.steps{ flex:1; overflow-y:auto; padding:18px 24px; }
.step{ display:flex; gap:14px; padding-bottom:22px; position:relative; }
.step::before{ content:''; position:absolute; left:13px; top:30px; bottom:0; width:2px; background:var(--border); }
.step:last-child::before{ display:none; }
.step .s-num{ width:28px; height:28px; border-radius:50%; background:var(--surface); border:2px solid var(--border); display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono'; font-weight:600; font-size:12px; flex-shrink:0; z-index:1; color:var(--muted); }
.step.current .s-num{ background:var(--accent); border-color:var(--accent); color:#fff; }
.step.done .s-num{ background:var(--ink); border-color:var(--ink); color:var(--on-ink); }
.step p{ font-size:14px; line-height:1.5; padding-top:4px; }
.step.current p{ font-weight:600; }

.route-nav{ padding:16px 24px 22px 24px; border-top:1px solid var(--border); display:flex; gap:10px; }
.nav-btn{ flex:1; padding:14px; border-radius:12px; font-weight:600; font-size:14px; border:1px solid var(--border); background:var(--card-bg); color:var(--text); }
.nav-btn:disabled{ opacity:.35; }
.nav-btn.primary{ background:var(--ink); color:var(--on-ink); border-color:var(--ink); }

/* ---------- IDLE OVERLAY ---------- */
.idle-overlay{
  position:fixed; inset:0; background:rgba(20,23,31,0.55); backdrop-filter:blur(3px);
  display:flex; align-items:center; justify-content:center; z-index:50;
  opacity:0; pointer-events:none; transition:opacity .2s ease;
}
.idle-overlay.show{ opacity:1; pointer-events:all; }
.idle-card{ background:var(--card-bg); border-radius:22px; padding:44px 44px; text-align:center; box-shadow:var(--shadow); max-width:380px; cursor:pointer; }
.idle-card h3{ font-family:'Space Grotesk'; font-size:21px; margin-bottom:10px; }
.idle-card p{ color:var(--muted); font-size:14px; line-height:1.55; }
.idle-icon-circle{
  width:60px; height:60px; border-radius:50%; background:var(--accent);
  display:flex; align-items:center; justify-content:center; color:#fff;
  margin:0 auto 20px auto; position:relative;
}
.idle-icon-circle svg{ position:relative; z-index:1; }
.idle-icon-circle::before, .idle-icon-circle::after{
  content:''; position:absolute; inset:0; border-radius:50%;
  border:2px solid var(--accent); opacity:0; animation:idleRing 2.2s ease-out infinite;
}
.idle-icon-circle::after{ animation-delay:.7s; }
@keyframes idleRing{
  0%{ transform:scale(1); opacity:.55; }
  100%{ transform:scale(1.9); opacity:0; }
}

@media (max-width:1200px){
  .place-grid{ grid-template-columns:1fr; }
}
@media (max-width:1024px) and (min-width:881px){
  .panel{ width:320px; } .sidebar{ width:340px; }
}

/* ==========================================================
   RESPONSIVE / MOBILE
   Abaixo de 880px o layout de 3 colunas (lista | mapa | painel)
   vira uma pilha: mapa em cima, lista logo abaixo (rolando junto
   com a página), e o painel de detalhes/trajeto passa a ser uma
   folha (bottom sheet) que sobe por cima ao selecionar um ambiente.
========================================================== */
.panel-backdrop{
  position:fixed; inset:0; background:rgba(20,23,31,.5);
  opacity:0; pointer-events:none; transition:opacity .25s ease; z-index:44;
}
.panel-backdrop.show{ opacity:1; pointer-events:all; }

@media (min-width:881px){
  .panel-backdrop{ display:none !important; }
}

@media (max-width:880px){

  /* ---- header ---- */
  header{ flex-wrap:wrap; row-gap:10px; padding:14px 16px; }
  .brand{ gap:10px; }
  .brand .mark{ width:36px; height:36px; font-size:12px; border-radius:10px; }
  .brand h1{ font-size:16px; }
  .brand span{ display:none; }
  .head-right{ width:100%; justify-content:space-between; gap:10px; }
  .a11y-toggle{ font-size:12px; padding:7px 12px; gap:8px; }
  .a11y-toggle span{ white-space:nowrap; }
  #clock{ font-size:12.5px; }

  /* ---- floor tabs ---- */
  .floors{ padding:10px 14px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .floors::-webkit-scrollbar{ display:none; }
  .floor-btn{ flex-shrink:0; padding:9px 16px; font-size:13px; }
  .floor-hint{ flex-shrink:0; }

  /* ---- main: stack map, then list; whole area scrolls ---- */
  main{ flex-direction:column; overflow-y:auto; -webkit-overflow-scrolling:touch; }

  .map-wrap{
    order:-1; /* o mapa vem antes da lista na pilha, mesmo vindo depois no HTML */
    flex:none; width:100%; height:auto; aspect-ratio:1000/640; max-height:56vh;
    padding:12px 14px 6px 14px;
  }
  .map-frame{ border-radius:16px; }

  .legend{
    left:10px; bottom:10px; right:10px; width:auto;
    gap:8px; padding:7px 10px; flex-wrap:wrap; max-width:calc(100% - 20px);
  }
  .legend div{ font-size:9.5px; }
  .legend span{ width:8px; height:8px; }

  .sidebar{
    width:100%; flex:none; min-height:0; height:auto;
    border-right:none; padding:6px 14px 24px 14px;
  }
  h2.eyebrow{ font-size:19px; }
  .search{ padding:13px 14px; border-radius:14px; }
  .groups{ flex:none; overflow:visible; margin-top:12px; margin-right:0; padding-right:0; }

  .place-grid{ grid-template-columns:1fr 1fr; gap:9px; }

  /* ---- detail / route panel becomes a bottom sheet ---- */
  .panel{
    position:fixed; left:0; right:0; bottom:0; width:100%; flex-shrink:0;
    max-height:82vh; border-left:none; border-top:1px solid var(--border);
    border-radius:20px 20px 0 0; box-shadow:var(--shadow);
    transform:translateY(105%); transition:transform .28s cubic-bezier(.32,.72,0,1);
    z-index:45; overflow-y:auto;
  }
  .panel::before{
    content:''; display:block; width:38px; height:4px; border-radius:3px;
    background:var(--border); margin:10px auto 2px auto; flex-shrink:0;
  }
  .panel.open{ transform:translateY(0); }
  .panel-empty{ display:none; } /* fechado por padrão: mapa e lista são a tela principal */

  .p-name{ font-size:21px; }
  .idle-card{ margin:0 20px; padding:30px 24px; max-width:none; }
}

@media (max-width:420px){
  .place-grid{ grid-template-columns:1fr; }
  .a11y-toggle span{ display:none; }
  .a11y-toggle{ padding:8px; gap:0; }
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="mark">CTT</div>
    <div>
      <h1>Encontre seu destino</h1>
      <span>Colégio Tadeu Thiago — totem de orientação</span>
    </div>
  </div>
  <div class="head-right">
    <button class="theme-toggle" id="themeToggle" title="Alternar modo claro/escuro" aria-label="Alternar modo claro/escuro">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.4M12 19.1v2.4M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.9 19.1l1.7-1.7M17.4 6.6l1.7-1.7"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M20.6 15.3a8.7 8.7 0 0 1-10.9-11 8.9 8.9 0 1 0 10.9 11Z"/></svg>
    </button>
    <div class="a11y-toggle" id="a11yToggle" role="button" tabindex="0" aria-label="Alternar rota com vídeo">
      <span>Rota com vídeo</span>

let lastInteraction = Date.now();
let idleShown = false;

const IDLE_BEFORE_ATTRACT = 20000; // ms sem interação até mostrar a tela de convite

/* =========================================================
   CLOCK
========================================================= */
function tickClock(){
  const d = new Date();
  document.getElementById('clock').textContent = d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
setInterval(tickClock,1000); tickClock();

/* =========================================================
   IDLE / TELA DE CONVITE (ATTRACT SCREEN)
   Após alguns segundos sem uso, o totem assume que ninguém está
   usando, volta para a tela inicial e mostra um convite para
   o próximo visitante tocar na tela.
========================================================= */
function markInteraction(){
  lastInteraction = Date.now();
  if(idleShown) hideIdleOverlay();
}
function hideIdleOverlay(){
  idleShown = false;
  document.getElementById('idleOverlay').classList.remove('show');
}
function checkIdle(){
  if(!idleShown && Date.now() - lastInteraction >= IDLE_BEFORE_ATTRACT){
    showIdleOverlay();
  }
}
function showIdleOverlay(){
  idleShown = true;
  resetToHome();
  document.getElementById('idleOverlay').classList.add('show');
}
setInterval(checkIdle, 1000);
['click','touchstart','input'].forEach(ev=> document.addEventListener(ev, markInteraction));

function resetToHome(){
  videoPlayToken++; videoPlaybackActive = false;
  currentFloor = 0; activeCat=null; selectedRoom=null; searchTerm=''; routeMode=false; steps=[]; stepIndex=0;
  document.getElementById('searchInput').value='';
  renderAll();
}

/* =========================================================
   THEME TOGGLE (claro / escuro, estilo Google Maps)
========================================================= */
let currentTheme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
document.documentElement.setAttribute('data-theme', currentTheme);

document.getElementById('themeToggle').onclick = ()=>{
  currentTheme = (currentTheme === 'light') ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', currentTheme);
};

/* =========================================================
   ACCESSIBLE TOGGLE
========================================================= */
document.getElementById('a11yToggle').addEventListener('keydown', e=>{
  if(e.key==='Enter' || e.key===' '){ e.preventDefault(); document.getElementById('a11yToggle').click(); }
});
document.getElementById('a11yToggle').onclick = ()=>{
  videoMode = !videoMode;
  document.getElementById('a11yToggle').classList.toggle('on', videoMode);
  if(routeMode && selectedRoom){
    buildRoute(selectedRoom);
    renderPanel();
    videoPlayToken++;
    if(videoMode){
      videoPlaybackActive = true;
      renderMap();
      playVideoRoute(selectedRoom);
    } else {
      videoPlaybackActive = false;
      renderMap();
    }
  }
};

/* =========================================================
   FLOOR TABS
========================================================= */
function renderFloorTabs(){
  const wrap = document.getElementById('floorTabs');
  wrap.innerHTML = '';
  FLOORS.forEach(f=>{
    const btn = document.createElement('button');
    let cls = 'floor-btn' + (f.id===currentFloor ? ' active':'');
    if(routeMode && selectedRoom && selectedRoom.floor===f.id && f.id!==currentFloor) cls += ' needed';
    btn.className = cls;
    btn.textContent = f.name;
    btn.onclick = ()=>{ if(videoPlaybackActive) return; currentFloor = f.id; renderMap(); renderFloorTabs(); renderGroups(); };
    wrap.appendChild(btn);
  });
  if(routeMode && selectedRoom && selectedRoom.floor !== currentFloor){
    const hint = document.createElement('span');
    hint.className = 'floor-hint';
    hint.textContent = '→ Continue no ' + FLOOR_NAME(selectedRoom.floor);
    wrap.appendChild(hint);
  }
}

/* =========================================================
   FILTER GROUPS (SIDEBAR)
========================================================= */
function renderGroups(){
  const wrap = document.getElementById('groups');
  wrap.innerHTML = '';

  // flat chip row — "Todos" + one chip per category (style borrowed from the totem preview)
  const row = document.createElement('div'); row.className='chip-row';
  const allChip = document.createElement('div');
  allChip.className = 'chip' + (activeCat===null ? ' active ink':'');
  if(activeCat===null){ allChip.style.background = 'var(--ink)'; }
  allChip.textContent = 'Todos';
  allChip.onclick = ()=>{ activeCat = null; exitRoute(); renderAll(); };
  row.appendChild(allChip);

  GROUPS.forEach(g=>{
    g.cats.forEach(cat=>{
      const chip = document.createElement('div');
      chip.className = 'chip' + (activeCat===cat ? ' active':'');
      if(activeCat===cat){ chip.style.background = g.color; }
      chip.innerHTML = `<span class="dot" style="background:${g.color}"></span>${CAT_LABEL[cat]}`;
      chip.onclick = ()=>{ activeCat = (activeCat===cat ? null : cat); exitRoute(); renderAll(); };
      row.appendChild(chip);
    });
  });
  wrap.appendChild(row);

  const listTitle = document.createElement('div');
  listTitle.className = 'list-title';
  listTitle.textContent = 'Ambientes — ' + currentFloorData().name;
  wrap.appendChild(listTitle);

  // card grid — layout borrowed from the totem preview's place list
  const grid = document.createElement('div'); grid.className='place-grid';
  const rooms = currentFloorData().rooms.filter(roomVisible);
  if(rooms.length===0){
    grid.innerHTML = `<div class="empty">Nada encontrado. Tente outro termo, categoria ou andar.</div>`;
  } else {
    rooms.forEach(r=>{
      const card = document.createElement('button');
      card.className = 'place-card' + (selectedRoom===r ? ' selected':'');
      card.innerHTML = `
        <div class="p-top">
          <div class="p-badge-sm" style="background:${colorFor(r.cat)}">${svgIcon(r.cat,16)}</div>
          <span class="p-arrow">→</span>
        </div>
        <strong>${r.name}</strong>
        <span class="p-card-meta">${CAT_LABEL[r.cat]||r.block} · ${r.block}</span>`;
      card.onclick = ()=> selectRoom(r);
      grid.appendChild(card);
    });
  }
  wrap.appendChild(grid);
}

/* =========================================================
   HELPERS
========================================================= */
function currentFloorData(){ return FLOORS[currentFloor]; }
function roomVisible(r){
  const catOk = !activeCat || r.cat===activeCat;
  const term = searchTerm.trim().toLowerCase();
  const searchOk = !term || r.name.toLowerCase().includes(term) || (r.n||'').toLowerCase().includes(term);
  return catOk && searchOk;
}

document.getElementById('searchInput').addEventListener('input', e=>{
  searchTerm = e.target.value;
  if(searchTerm.trim()){
    // jump to first match's floor for visibility
    const term = searchTerm.trim().toLowerCase();
    for(const f of FLOORS){
      const hit = f.rooms.find(r=> r.name.toLowerCase().includes(term) || (r.n||'').toLowerCase().includes(term));
      if(hit){ currentFloor = f.id; break; }
    }
  }
  exitRoute();
  renderAll();
});

/* =========================================================
   MAP RENDER
========================================================= */
const ns = "http://www.w3.org/2000/svg";
function el(tag, attrs){ const e=document.createElementNS(ns,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); return e; }

function renderLegend(){
  const wrap = document.getElementById('legend');
  wrap.innerHTML = '';
  GROUPS.forEach(g=>{
    const d = document.createElement('div');
    d.innerHTML = `<span style="background:${g.color}"></span>${g.label}`;
    wrap.appendChild(d);
  });
}

function renderMap(){
  const svg = document.getElementById('floorplan');
  svg.innerHTML = '';
  const floor = currentFloorData();

  svg.appendChild(el('rect',{x:CORRIDOR.x,y:CORRIDOR.y,width:CORRIDOR.w,height:CORRIDOR.h,class:'corridor',rx:4}));
  const cl = el('text',{x:CORRIDOR.x+CORRIDOR.w/2,y:CORRIDOR.y+CORRIDOR.h/2+4,class:'corridor-label','text-anchor':'middle'});
  cl.textContent = 'CORREDOR PRINCIPAL';
  svg.appendChild(cl);

  floor.rooms.forEach(r=>{
    const visible = roomVisible(r);
    const g = el('g',{class:'room'+(visible?'':' dim')+(selectedRoom===r?' selected':'')});
    g.onclick = ()=> selectRoom(r);
    const color = colorFor(r.cat);
    const rect = el('rect',{x:r.x,y:r.y,width:r.w,height:r.h,rx:12,fill:'var(--card-bg)',stroke:color});
    g.appendChild(rect);

    // small icon tile top-left
    const iconBg = el('rect',{x:r.x+10,y:r.y+10,width:26,height:26,rx:7,fill:color});
    g.appendChild(iconBg);
    const iconFO = el('foreignObject',{x:r.x+13,y:r.y+13,width:20,height:20});
    const div = document.createElement('div');
    div.style.color = '#fff'; div.innerHTML = svgIcon(r.cat,20);
    iconFO.appendChild(div);
    g.appendChild(iconFO);

    const label = el('text',{x:r.x+10,y:r.y+r.h-14,class:'room-label'});
    label.textContent = r.name.length>16 ? r.name.slice(0,15)+'…' : r.name;
    g.appendChild(label);

    if(r.n && !/^\d+$/.test('')){
      const sub = el('text',{x:r.x+10,y:r.y+r.h-4,class:'room-sub'});
      sub.textContent = r.block;
      g.appendChild(sub);
    }

    svg.appendChild(g);
  });

  // route
  if(routeMode && selectedRoom){
    drawRouteLeg(svg, floor);
  }

  // pin
  if(floor.hasYouAreHere){
    const pg = el('g');
    pg.appendChild(el('circle',{cx:YOU_ARE_HERE.x,cy:YOU_ARE_HERE.y,r:6,fill:'var(--accent)',class:'pin-pulse','fill-opacity':'0.45'}));
    pg.appendChild(el('circle',{cx:YOU_ARE_HERE.x,cy:YOU_ARE_HERE.y,r:6,fill:'var(--accent)',class:'pin-pulse2','fill-opacity':'0.45'}));
    pg.appendChild(el('circle',{cx:YOU_ARE_HERE.x,cy:YOU_ARE_HERE.y,r:8,fill:'var(--accent)',stroke:'var(--card-bg)','stroke-width':'2.5'}));
    const bg = el('rect',{x:YOU_ARE_HERE.x-56,y:YOU_ARE_HERE.y-34,width:112,height:18,rx:4,class:'you-label-bg'});
    pg.appendChild(bg);
    const label = el('text',{x:YOU_ARE_HERE.x,y:YOU_ARE_HERE.y-20,class:'you-label','text-anchor':'middle'});
    label.textContent = 'VOCÊ ESTÁ AQUI';
    pg.appendChild(label);
    svg.appendChild(pg);
  }
}

function roomCenter(r){ return {x:r.x+r.w/2, y:r.y+r.h/2}; }
function coreAnchor(){ return {x:CORE.elevX, y:CORE.elevY+CORE.h/2}; }

/* Calcula o trecho da rota (caminho + curvas) que pertence a um andar específico.
   Reaproveitado tanto no traçado estático quanto na reprodução em vídeo. */
function routeLegForFloor(room, floorId){
  const midY = CORRIDOR.y + CORRIDOR.h/2;
  if(room.floor === floorId && floorId === 0){
    const t = roomCenter(room);
    return { pathData:`M ${YOU_ARE_HERE.x} ${YOU_ARE_HERE.y} L ${t.x} ${midY} L ${t.x} ${t.y}`, end:t, corners:[{x:t.x,y:midY}] };
  }
  if(room.floor !== 0 && floorId === 0){
    const core = coreAnchor();
    return { pathData:`M ${YOU_ARE_HERE.x} ${YOU_ARE_HERE.y} L ${core.x} ${midY} L ${core.x} ${core.y}`, end:core, corners:[{x:core.x,y:midY}] };
  }
  if(room.floor !== 0 && floorId === room.floor){
    const core = coreAnchor();
    const t = roomCenter(room);
    return { pathData:`M ${core.x} ${core.y} L ${core.x} ${midY} L ${t.x} ${midY} L ${t.x} ${t.y}`, end:t, corners:[{x:core.x,y:midY},{x:t.x,y:midY}] };
  }
  return null;
}
function legsForRoom(room){ return room.floor === 0 ? [0] : [0, room.floor]; }

/* Traçado estático (não animado) — usado quando não se está reproduzindo o vídeo da rota. */
function drawRouteLeg(svg, floor){
  if(videoPlaybackActive) return; // durante a reprodução, quem desenha é playVideoRoute
  const leg = routeLegForFloor(selectedRoom, floor.id);
  if(!leg) return;
  const accessible = videoMode ? ' accessible' : '';
  svg.appendChild(el('path',{d:leg.pathData, class:'route-line'+accessible, id:'routePath'}));
  svg.appendChild(el('circle',{cx:leg.end.x,cy:leg.end.y,r:7,class:'route-endpoint'+accessible,stroke:'var(--card-bg)','stroke-width':'2.5'}));
}

function walkerFigure(){
  const holder = el('g',{class:'route-walker'});
  holder.appendChild(el('circle',{cx:'0',cy:'0',r:'8',fill:'var(--accent)',opacity:'0.28',class:'pin-pulse'}));
  holder.appendChild(el('circle',{cx:'0',cy:'0',r:'15',fill:'var(--card-bg)',stroke:'var(--accent)','stroke-width':'2.5'}));
  const label = el('text',{x:'0',y:'1','text-anchor':'middle','dominant-baseline':'central','font-size':'16'});
  label.textContent = '🚶';
  holder.appendChild(label);
  return holder;
}
function sleep(ms){ return new Promise(res=>setTimeout(res,ms)); }
function showToast(text){
  const t = document.getElementById('videoToast');
  if(!t) return;
  t.textContent = text;
  t.classList.add('show');
}
function hideToast(){
  const t = document.getElementById('videoToast');
  if(t) t.classList.remove('show');
}

/* Anima um único trecho da rota: a linha se desenha progressivamente (no ritmo real
   da distância, ~1,3 m/s) enquanto a figura caminha sobre ela — apenas uma passagem,
   sem loop, para não distrair o usuário do totem. */
function playLegAnimation(svg, leg, token, isFinal, room){
  return new Promise(resolve=>{
    const accessible = videoMode ? ' accessible' : '';
    const path = el('path',{d:leg.pathData, class:'route-line-video'+accessible, id:'routePath'});
    svg.appendChild(path);
    const len = path.getTotalLength();
    path.style.strokeDasharray = len;
    path.style.strokeDashoffset = len;

    // pontos de curva — pequenas marcações discretas nos cantos do trajeto
    leg.corners.forEach(c=>{
      svg.appendChild(el('circle',{cx:c.x,cy:c.y,r:3.5,fill:'var(--card-bg)',stroke: videoMode?'var(--accessible)':'var(--accent)','stroke-width':'2'}));
    });

    const PX_PER_SEC = 130; // ritmo confortável de caminhada para acompanhar na tela
    const duration = Math.min(6000, Math.max(1100, (len/PX_PER_SEC)*1000));

    const lineAnim = path.animate(
      [{strokeDashoffset:len},{strokeDashoffset:0}],
      {duration, easing:'linear', fill:'forwards'}
    );

    const walker = walkerFigure();
    svg.appendChild(walker);
    const anim = el('animateMotion',{dur:(duration/1000)+'s', repeatCount:'1', calcMode:'linear', fill:'freeze'});
    const mpath = el('mpath',{});
    mpath.setAttribute('href','#'+path.id);
    mpath.setAttributeNS('http://www.w3.org/1999/xlink','href','#'+path.id);
    anim.appendChild(mpath);
    walker.appendChild(anim);

    lineAnim.onfinish = ()=>{
      if(token!==videoPlayToken) return resolve();
      svg.appendChild(el('circle',{cx:leg.end.x,cy:leg.end.y,r:7,class:'route-endpoint'+accessible,stroke:'var(--card-bg)','stroke-width':'2.5'}));
      if(isFinal){
        svg.appendChild(el('circle',{cx:leg.end.x,cy:leg.end.y,r:7,fill:videoMode?'var(--accessible)':'var(--accent)',class:'pin-pulse','fill-opacity':'0.4'}));
        showToast('Você chegou — ' + room.name + ' 🎉');
      }
      setTimeout(resolve, 300);
    };
  });
}

/* Reproduz a rota inteira como um "vídeo": caminha no térreo, se necessário troca de
   andar automaticamente (com aviso), e continua até o destino — sem exigir cliques
   manuais nas abas de andar. */
async function playVideoRoute(room){
  const token = ++videoPlayToken;
  videoPlaybackActive = true;
  const floors = legsForRoom(room);

  for(let i=0;i<floors.length;i++){
    if(token!==videoPlayToken) return;
    currentFloor = floors[i];
    renderFloorTabs();
    renderMap();
    if(token!==videoPlayToken) return;

    if(i===0){
      showToast('Saindo de "Você está aqui" até ' + room.name);
      await sleep(1100);
    } else {
      showToast('Trocando de andar — indo para o ' + FLOOR_NAME(currentFloor));
      await sleep(1200);
    }
    if(token!==videoPlayToken) return;
    hideToast();

    const svg = document.getElementById('floorplan');
    const leg = routeLegForFloor(room, currentFloor);
    if(leg){
      await playLegAnimation(svg, leg, token, i===floors.length-1, room);
    }
    if(token!==videoPlayToken) return;
  }

  if(token!==videoPlayToken) return;
  await sleep(2200);
  hideToast();
  videoPlaybackActive = false;
  renderFloorTabs();
  renderPanel();
}

/* =========================================================
   DISTANCE / TIME ESTIMATE
========================================================= */
const PX_TO_M = 0.10;
function estimate(room){
  let px = 0;
  const midY = CORRIDOR.y + CORRIDOR.h/2;
  if(room.floor===0){
    const t = roomCenter(room);
    px = Math.abs(t.x-YOU_ARE_HERE.x) + Math.abs(midY-YOU_ARE_HERE.y) + Math.abs(t.y-midY);
  } else {
    const core = coreAnchor();
    px = Math.abs(core.x-YOU_ARE_HERE.x) + Math.abs(midY-YOU_ARE_HERE.y);
    const t = roomCenter(room);
    px += Math.abs(t.x-core.x) + Math.abs(t.y-midY);
    px += 60; // vertical circulation allowance per floor change
  }
  const meters = Math.max(20, Math.round(px*PX_TO_M/10)*10);
  const mins = Math.max(1, Math.round(meters/70));
  return { meters, mins };
}

/* =========================================================
   RIGHT PANEL — DETAIL
========================================================= */
function syncPanelSheet(){
  // No mobile, o painel vira uma "folha" (bottom sheet) que só sobe quando
  // há um ambiente selecionado — no desktop essas classes não têm efeito.
  const panel = document.getElementById('panel');
  const backdrop = document.getElementById('panelBackdrop');
  const shouldOpen = !!selectedRoom;
  panel.classList.toggle('open', shouldOpen);
  if(backdrop) backdrop.classList.toggle('show', shouldOpen);
}

function renderPanel(){
  const panel = document.getElementById('panel');
  if(routeMode && selectedRoom){ renderRoutePanel(panel); syncPanelSheet(); return; }

  if(!selectedRoom){
    panel.innerHTML = `<div class="panel-empty">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 21s-7-6.1-7-11.5A7 7 0 0 1 12 2a7 7 0 0 1 7 7.5C19 14.9 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.4"/></svg>
      Toque em um ambiente no mapa ou na lista ao lado para ver informações e o trajeto até ele.
    </div>`;
    syncPanelSheet();
    return;
  }

  const r = selectedRoom;
  const est = estimate(r);
  const changesFloor = r.floor !== 0;

  panel.innerHTML = `
    <div class="panel-content">
      <div class="p-badge" style="background:${colorFor(r.cat)}">${svgIcon(r.cat,26)}</div>
      <div class="p-name">${r.name}</div>
      <div class="p-meta">${r.block} · ${FLOOR_NAME(r.floor)}</div>
      <div class="p-desc">${r.desc}</div>
      <div class="p-stats">
        <div class="p-stat"><b>${est.meters} m</b><span>Distância</span></div>
        <div class="p-stat"><b>≈ ${est.mins} min</b><span>A pé</span></div>
      </div>
      ${changesFloor ? `<div class="alert-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>
          <span>Este ambiente fica no ${FLOOR_NAME(r.floor)}. Será necessário usar o elevador ou a escada.</span>
        </div>` : ``}
      <button class="btn btn-primary${videoMode?' accessible':''}" id="btnRoute">Visualizar trajeto</button>
      <button class="btn btn-secondary" id="btnBack">Voltar ao mapa</button>
    </div>
  `;
  document.getElementById('btnRoute').onclick = ()=> startRoute(r);
  document.getElementById('btnBack').onclick = ()=> { selectedRoom=null; renderAll(); };
  syncPanelSheet();
}

/* =========================================================
   ROUTE PANEL (STEP BY STEP)
========================================================= */
function buildRoute(room){
  const est = estimate(room);
  const list = [];
  if(room.floor === 0){
    list.push({floor:0, text:`Saia da recepção e siga pelo corredor principal até ${room.name}.`});
  } else {
    list.push({floor:0, text:`A partir da recepção, siga pelo corredor principal até a área de circulação.`});
    list.push({floor:0, text:`Suba pela escada ou elevador até o ${FLOOR_NAME(room.floor)}.`});
    list.push({floor:room.floor, text:`Ao chegar, siga pelo corredor até ${room.name}.`});
  }
  list.push({floor:room.floor, text:`${room.name} estará à sua frente.`});
  steps = list;
  stepIndex = 0;
  return est;
}

function startRoute(room){
  selectedRoom = room;
  routeMode = true;
  buildRoute(room);
  currentFloor = 0; // always start the visual walk-through from the totem's floor
  videoPlayToken++;
  if(videoMode){
    videoPlaybackActive = true;
    renderAll();
    playVideoRoute(room);
  } else {
    videoPlaybackActive = false;
    renderAll();
  }
}
function exitRoute(){
  routeMode = false; steps=[]; stepIndex=0;
  videoPlayToken++; videoPlaybackActive = false;
  hideToast();
}

function goStep(delta){
  if(videoPlaybackActive) return; // evita conflito com a reprodução automática em andamento
  stepIndex = Math.min(steps.length-1, Math.max(0, stepIndex+delta));
  currentFloor = steps[stepIndex].floor;
  renderMap(); renderFloorTabs(); renderPanel();
}

function renderRoutePanel(panel){
  const r = selectedRoom;
  const est = estimate(r);
  panel.innerHTML = `
    <div class="route-head">
      <div class="r-from-to">Você está aqui &nbsp;→&nbsp; ${r.name}</div>
      <h2>${r.name}</h2>
      <div class="route-stats">
        <div class="p-stat"><b>${est.meters} m</b><span>Distância</span></div>
        <div class="p-stat"><b>≈ ${est.mins} min</b><span>A pé</span></div>
      </div>
    </div>
    <div class="steps" id="stepsWrap"></div>
    ${videoMode ? `<div style="padding:0 24px 8px 24px;">
        <button class="nav-btn" id="btnReplay" ${videoPlaybackActive?'disabled':''}>↻ Assistir de novo</button>
      </div>` : ``}
    <div class="route-nav">
      <button class="nav-btn" id="stepPrev">Anterior</button>
      <button class="nav-btn primary" id="stepNext">Próximo</button>
    </div>
    <div style="padding:0 24px 22px 24px;">
      <button class="btn btn-secondary" id="btnEndRoute">Voltar ao mapa</button>
    </div>
  `;
  const stepsWrap = document.getElementById('stepsWrap');
  steps.forEach((s,i)=>{
    const d = document.createElement('div');
    d.className = 'step' + (i===stepIndex?' current':'') + (i<stepIndex?' done':'');
    d.innerHTML = `<div class="s-num">${i+1}</div><p>${s.text}</p>`;
    stepsWrap.appendChild(d);
  });
  document.getElementById('stepPrev').disabled = stepIndex===0 || videoPlaybackActive;
  document.getElementById('stepPrev').onclick = ()=> goStep(-1);
  document.getElementById('stepNext').disabled = stepIndex===steps.length-1 || videoPlaybackActive;
  document.getElementById('stepNext').textContent = stepIndex===steps.length-1 ? 'Chegou ✓' : 'Próximo';
  document.getElementById('stepNext').onclick = ()=>{ if(stepIndex<steps.length-1) goStep(1); };
  document.getElementById('btnEndRoute').onclick = ()=>{ exitRoute(); renderAll(); };
  const replayBtn = document.getElementById('btnReplay');
  if(replayBtn){
    replayBtn.onclick = ()=>{
      videoPlayToken++;
      videoPlaybackActive = true;
      currentFloor = 0;
      renderAll();
      playVideoRoute(r);
    };
  }
}

/* =========================================================
   SELECT / RENDER ALL
========================================================= */
function selectRoom(r){
  selectedRoom = (selectedRoom===r) ? null : r;
  routeMode = false; steps=[]; stepIndex=0;
  videoPlayToken++; videoPlaybackActive = false;
  hideToast();
  renderAll();
}

function renderAll(){
  renderFloorTabs();
  renderGroups();
  renderMap();
  renderPanel();
  renderLegend();
}

document.getElementById('panelBackdrop').addEventListener('click', ()=>{
  if(videoPlaybackActive) return;
  if(routeMode) exitRoute();
  selectedRoom = null;
  renderAll();
});

renderAll();
</script>
